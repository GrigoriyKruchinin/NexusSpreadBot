[project]
name = "nexus-spread-bot"
version = "0.1.0"
description = "Nexus Spread Scanner: async multi-exchange arbitrage spread scanner with Telegram alerts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "ccxt>=4.5.88",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "protobuf==5.29.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "fakeredis>=2.40.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/nexus/persistence/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "ANN", "SIM", "PT",
    "C4", "DTZ", "T20", "RET", "PIE", "TID", "PERF",
]
ignore = [
    "ANN401",  # Any is allowed at untyped third-party boundaries (ccxt) with justification
    "RUF001",  # emoji are intentional in Telegram templates
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "N817"]
"src/nexus/persistence/migrations/**" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["nexus"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nexus"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires running Postgres/Redis (docker compose local stack)",
]
filterwarnings = ["error::DeprecationWarning:nexus.*"]

[tool.coverage.run]
source = ["src/nexus"]
branch = true
omit = ["src/nexus/persistence/migrations/*"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]
