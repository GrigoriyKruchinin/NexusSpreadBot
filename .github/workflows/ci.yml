name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege for every job. No repository secrets are used anywhere in this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.8" # keep in sync with Dockerfile
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: make lint
      # T8/T11: syntax check of every shell script (start.sh and helpers).
      - run: for f in scripts/*.sh; do bash -n "$f"; done

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: make typecheck

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      # Floor is enforced by [tool.coverage.report] fail_under = 89 in pyproject.toml.
      - run: make test-cov
      # T11: unit tests must be hermetic. Run again with hostile Nexus variables in the environment
      # (and a hostile .env in the repo root): the result must not change.
      - name: Unit tests with a hostile environment
        env:
          KEY_POLICY_STRICT: "true"
          TELEGRAM_CHAT_ID: "999"
          POSTGRES_DB: nexus
          SPREAD_MIN_NET_PROFIT_USD: "99"
        run: |
          printf 'KEY_POLICY_STRICT=true\nTELEGRAM_CHAT_ID=999\n' > .env
          make test
          rm -f .env

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway service container: fake credentials, database nexus_test only.
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-throwaway-password-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nexus_test
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ci-throwaway-password-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      # Fail early if the target is not the dedicated test DB (R-01); tests/db_guard.py
      # enforces the same inside pytest.
      - name: Assert test database name
        run: test "$POSTGRES_DB" = "nexus_test"
      - run: make test-integration

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history on every run
          persist-credentials: false
      - name: Install gitleaks (pinned version and checksum)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl"
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gl" gitleaks
          rm gitleaks.tgz
      - name: Scan full history (findings redacted, job fails on any finding)
        run: '"$RUNNER_TEMP/gl/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .'

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Audit runtime and dev dependency groups
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only: no push, no registry login.
      - run: docker build -t nexus-spread-bot:ci .
      # T8: syntax check of the one-command start script (a full compose smoke needs a fake Telegram
      # endpoint; documented manual check: `make up` on a fresh project, see docs/tasks/tool/T8).
      - run: bash -n scripts/start.sh
