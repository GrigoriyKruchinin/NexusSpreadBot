# Nexus Spread Scanner — the stack for users (read-only alerts, no trading).
#   cp .env.example .env   # fill TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
#   make up                # or: scripts/start.sh   (build, migrate, start)
#
# Every service receives ONLY the secrets of its own domain (see x-*-env anchors). All other
# settings come from config/nexus.toml, BAKED into the image (A7, D-01b; rebuild to change a setting).
# Optional variables use ${VAR:-} -> empty means "use the default" (env_ignore_empty).

name: nexus

x-image: &image
  image: nexus-spread-bot:local
  build:
    context: .
    target: runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  # D-01b: NO bind mounts here. Docker Desktop (WSL2) mounts WSL-distro paths only after its distro proxy
  # is up, which happens AFTER the engine restarted the containers on `wsl --shutdown` / reboot; a bind
  # source that is not there yet kills the container at start (Exited 127, no app log). config/nexus.toml
  # is copied into the image instead (Dockerfile); the file holds no secrets and is guarded at startup.
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

x-celery-env: &celery-env
  CELERY_BROKER_URL: redis://redis:6379/1

x-scanner-env: &scanner-env
  REDIS_URL: redis://redis:6379/0
  BYBIT_API_KEY: ${BYBIT_API_KEY:-}
  BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
  BINANCE_API_KEY: ${BINANCE_API_KEY:-}
  BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
  OKX_API_KEY: ${OKX_API_KEY:-}
  OKX_API_SECRET: ${OKX_API_SECRET:-}
  OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}
  GATEIO_API_KEY: ${GATEIO_API_KEY:-}
  GATEIO_API_SECRET: ${GATEIO_API_SECRET:-}
  KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
  KUCOIN_API_SECRET: ${KUCOIN_API_SECRET:-}
  KUCOIN_API_PASSPHRASE: ${KUCOIN_API_PASSPHRASE:-}
  KEY_POLICY_STRICT: ${KEY_POLICY_STRICT:-}

x-telegram-env: &telegram-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID must be set in .env}

services:
  postgres:
    # Digest-pinned (security R5); refresh tag+digest together on a deliberate update.
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    environment:
      # Must equal [postgres] db / user in config/nexus.toml (checked by tests/unit/test_compose.py).
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port by default (nothing on the host can clash with 5432). For SQL access from the host
    # add docker-compose.postgres-port.yml (127.0.0.1 only), see README.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    <<: *image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: [*db-env]
    depends_on:
      postgres: {condition: service_healthy}

  scanner:
    <<: *image
    # D-01: key-policy refusal (exit 3) must NOT restart-loop (it would re-call the signed key
    # introspection endpoints forever), but the scanner must come back after a Docker/WSL restart.
    # Docker cannot filter by exit code and `on-failure` containers are not restarted by the daemon
    # after a restart, so: `unless-stopped`, and on exit 3 the wrapper PARKS (sleeps, container stays
    # up/unhealthy, no API calls) until stopped. A daemon restart re-runs the scanner once, which
    # re-evaluates the policy. SIGTERM/SIGINT are forwarded to the scanner (trap is set before the fork)
    # and end the park immediately. Executable test: tests/unit/test_compose.py.
    command:
      - sh
      - -c
      - |
        pid=""; stop=0
        trap 'stop=1; [ -n "$$pid" ] && kill -TERM "$$pid" 2>/dev/null' TERM INT
        nexus scanner &
        pid=$$!
        [ "$$stop" -eq 0 ] || kill -TERM "$$pid" 2>/dev/null
        wait "$$pid"; rc=$$?
        while kill -0 "$$pid" 2>/dev/null; do wait "$$pid"; rc=$$?; done
        if [ "$$rc" -eq 3 ] && [ "$$stop" -eq 0 ]; then
          echo "scanner refused the key policy (exit 3): parked, not restarting; fix the keys, then restart it manually" >&2
          sleep 2147483647 &
          sp=$$!
          trap 'kill "$$sp" 2>/dev/null; exit 0' TERM INT
          wait "$$sp"
          exit 0
        fi
        exit "$$rc"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: [*db-env, *celery-env, *scanner-env]
    depends_on:
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      worker-alerts: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nexus", "healthcheck", "scanner"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  worker-alerts:
    <<: *image
    command: ["celery", "-A", "nexus.workers.app:celery_app", "worker", "-Q", "alerts",
              "-n", "alerts@%h", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      <<: [*db-env, *celery-env, *telegram-env]
      NEXUS_WORKER_ROLE: alerts
    depends_on:
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A nexus.workers.app:celery_app inspect ping -d alerts@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  worker-maintenance:
    <<: *image
    command: ["celery", "-A", "nexus.workers.app:celery_app", "worker", "-Q", "maintenance",
              "-n", "maintenance@%h", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      <<: [*db-env, *celery-env]
      NEXUS_WORKER_ROLE: maintenance
    depends_on:
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A nexus.workers.app:celery_app inspect ping -d maintenance@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # `nexus check` (T7): validates Telegram, exchange keys and the database. Not started by `up`
  # (profile "tools"); scripts/start.sh and `make doctor` run it as a one-off container.
  check:
    <<: *image
    restart: "no"
    profiles: ["tools"]
    command: ["nexus", "check"]
    environment:
      <<: [*db-env, *scanner-env, *telegram-env]

  beat:
    <<: *image
    command: ["celery", "-A", "nexus.workers.app:celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid"]
    environment:
      <<: [*celery-env]
    depends_on:
      redis: {condition: service_healthy}
      worker-maintenance: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Default (project-scoped) names: nexus_postgres-data / nexus_redis-data. `make down` keeps them.
  postgres-data:
  redis-data:
