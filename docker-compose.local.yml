# Nexus Spread Scanner — local (Version 1, read-only) stack.
#   cp .env.example .env  &&  make up-local
#
# Every service receives ONLY the secrets of its own domain (see x-*-env anchors). All other
# settings come from config/nexus.toml, mounted read-only into every app container (A7).
# Optional variables use ${VAR:-} -> empty means "use the default" (env_ignore_empty).

name: nexus-local

x-image: &image
  image: nexus-spread-bot:local
  build:
    context: .
    target: runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./config/nexus.toml:/app/config/nexus.toml:ro  # no secrets in it (guarded at startup)
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

x-celery-env: &celery-env
  CELERY_BROKER_URL: redis://redis:6379/1

x-scanner-env: &scanner-env
  REDIS_URL: redis://redis:6379/0
  BYBIT_API_KEY: ${BYBIT_API_KEY:-}
  BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
  BINANCE_API_KEY: ${BINANCE_API_KEY:-}
  BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
  OKX_API_KEY: ${OKX_API_KEY:-}
  OKX_API_SECRET: ${OKX_API_SECRET:-}
  OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}
  GATEIO_API_KEY: ${GATEIO_API_KEY:-}
  GATEIO_API_SECRET: ${GATEIO_API_SECRET:-}
  KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
  KUCOIN_API_SECRET: ${KUCOIN_API_SECRET:-}
  KUCOIN_API_PASSPHRASE: ${KUCOIN_API_PASSPHRASE:-}
  KEY_POLICY_KUCOIN_IP_ATTESTED: ${KEY_POLICY_KUCOIN_IP_ATTESTED:-}
  KEY_POLICY_GATEIO_PERMISSIONS_ATTESTED: ${KEY_POLICY_GATEIO_PERMISSIONS_ATTESTED:-}

x-telegram-env: &telegram-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID must be set in .env}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Must equal [postgres] db / user in config/nexus.toml (checked by tests/unit/test_compose.py).
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # local analytics access only (never exposed publicly)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    <<: *image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: [*db-env]
    depends_on:
      postgres: {condition: service_healthy}

  scanner:
    <<: *image
    # D-01: key-policy refusal (exit 3) must NOT restart-loop (it would re-call the signed key
    # introspection endpoints forever), every other failure must restart without a limit.
    # Docker cannot filter by exit code, so the wrapper maps exit 3 -> exit 0, and `on-failure`
    # (unlimited, built-in exponential backoff, reset after 10 s of uptime) restarts only non-zero
    # exits. SIGTERM/SIGINT are forwarded to the scanner so the graceful shutdown still works.
    # A clean stop (exit 0) is also not restarted, which is the wanted behaviour for `compose stop`.
    command:
      - sh
      - -c
      - |
        nexus scanner &
        pid=$$!
        trap 'kill -TERM "$$pid" 2>/dev/null' TERM INT
        wait "$$pid"; rc=$$?
        while kill -0 "$$pid" 2>/dev/null; do wait "$$pid"; rc=$$?; done
        if [ "$$rc" -eq 3 ]; then
          echo "scanner refused the key policy (exit 3): not restarting; fix the keys and start it manually" >&2
          exit 0
        fi
        exit "$$rc"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      <<: [*db-env, *celery-env, *scanner-env]
    depends_on:
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      worker-alerts: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nexus", "healthcheck", "scanner"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  worker-alerts:
    <<: *image
    command: ["celery", "-A", "nexus.workers.app:celery_app", "worker", "-Q", "alerts",
              "-n", "alerts@%h", "--concurrency", "2", "--loglevel", "INFO"]
    environment:
      <<: [*db-env, *celery-env, *telegram-env]
      NEXUS_WORKER_ROLE: alerts
    depends_on:
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A nexus.workers.app:celery_app inspect ping -d alerts@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  worker-maintenance:
    <<: *image
    command: ["celery", "-A", "nexus.workers.app:celery_app", "worker", "-Q", "maintenance",
              "-n", "maintenance@%h", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      <<: [*db-env, *celery-env]
      NEXUS_WORKER_ROLE: maintenance
    volumes:
      # Backup status for the liveness watchdog (S0b), read-only. NOT the 0700 dump dir (the container
      # uid cannot enter it and must not see dumps): backup.sh mirrors last_backup.json here.
      - ./config/nexus.toml:/app/config/nexus.toml:ro
      - ${BACKUP_STATUS_DIR:-${HOME}/nexus-backup-status}:/backups:ro
    depends_on:
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A nexus.workers.app:celery_app inspect ping -d maintenance@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    <<: *image
    command: ["celery", "-A", "nexus.workers.app:celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid"]
    environment:
      <<: [*celery-env]
    depends_on:
      redis: {condition: service_healthy}
      worker-maintenance: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
